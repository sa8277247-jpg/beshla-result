<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>موقع نتيجة مدرسة بشلا الإعدادية بنات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(to bottom, #f5f5f5, #ddd); text-align: center; margin: 0; padding: 0; }
        .logo { margin: 20px auto; width: 180px; }
        .btn { display: block; margin: 20px auto; padding: 20px; width: 300px; font-size: 22px; background: linear-gradient(45deg, #d4af37, #b8860b); color: white; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: linear-gradient(45deg, #b8860b, #d4af37); }
        #searchSection { display: none; margin-top: 30px; }
        input[type="number"] { padding: 12px; font-size: 18px; width: 250px; text-align: center; border-radius: 8px; border: 1px solid #aaa; }
        #errorMsg { color: red; font-size: 18px; margin-top: 10px; display: none; }
        #resultSection { display: none; margin-top: 30px; text-align: center; }
        table { margin: 20px auto; border-collapse: collapse; width: 70%; }
        th, td { border: 1px solid #ccc; padding: 10px; font-size: 18px; }
        th { background-color: #d4af37; color: white; }
        .ضعيف { color: red; font-weight: bold; }
        .print-btn { padding: 12px 30px; background-color: #d4af37; color: white; font-size: 20px; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
